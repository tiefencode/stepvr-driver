name: build-stepvr-driver

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: checkout openvr sdk
        uses: actions/checkout@v4
        with:
          repository: ValveSoftware/openvr
          path: openvr

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v2

      - name: configure
        shell: cmd
        run: |
          set OPENVR_SDK_ROOT=%CD%\openvr
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: build
        shell: cmd
        run: |
          cmake --build build --config Release

      - name: package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\driver.vrdrivermanifest dist\driver.vrdrivermanifest
          Copy-Item build\bin\win64\driver_stepvr.dll dist\driver_stepvr.dll
          New-Item -ItemType Directory -Force -Path dist\resources\input | Out-Null
          New-Item -ItemType Directory -Force -Path dist\resources\localization | Out-Null
          New-Item -ItemType Directory -Force -Path dist\resources\settings | Out-Null
          Copy-Item resources\input\* dist\resources\input\
          Copy-Item resources\localization\* dist\resources\localization\
          Copy-Item resources\settings\* dist\resources\settings\
          Copy-Item scripts\register_driver.bat dist\register_driver.bat
          Copy-Item scripts\unregister_driver.bat dist\unregister_driver.bat
          Copy-Item README.md dist\README.md

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stepvr-driver-windows
          path: dist